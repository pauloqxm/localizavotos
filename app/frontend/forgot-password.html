<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalizaVotos &mdash; Recuperar Senha</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-bg">
    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">
        <img
          class="lv-brand-logo lv-brand-logo--auth"
          src="https://horizons-cdn.hostinger.com/4ad642f6-9e8a-4f55-a2f3-602507bdf4d1/3fd8bf3d6dc1507af72425d277be9015.jpg"
          alt="Localiza Votos"
          width="44"
          height="44"
          decoding="async"
        />
      </div>
      <p class="auth-subtitle">Plataforma de Análise Eleitoral</p>

      <h2 class="auth-heading">Recuperar senha</h2>

      <!-- Formulário -->
      <div id="formSection">
        <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 20px; line-height: 1.6;">
          Informe o e-mail cadastrado na sua conta. Enviaremos um link para criar uma nova senha.
        </p>

        <form id="forgotForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">E-mail</label>
            <input
              class="form-input"
              type="email"
              id="email"
              name="email"
              placeholder="seu@email.com"
              autocomplete="email"
              required
            >
          </div>

          <div class="alert alert-error" id="errorMsg" role="alert"></div>
          <div class="alert alert-success" id="successMsg" role="status"></div>

          <button class="btn btn-primary" type="submit" id="submitBtn">
            <span class="btn-text">Enviar link de recuperação</span>
            <span class="btn-spinner"></span>
          </button>
        </form>
      </div>

      <!-- Links auxiliares -->
      <div class="auth-footer">
        <a href="/login.html">&larr; Voltar ao login</a>
      </div>

    </div>
  </div>

  <script src="/js/forgot-password.js"></script>
</body>
</html>
