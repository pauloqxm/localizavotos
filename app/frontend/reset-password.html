<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalizaVotos &mdash; Nova Senha</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-bg">
    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">
        <div class="auth-logo-icon">📍</div>
        <div class="auth-logo-text">Localiza<span>Votos</span></div>
      </div>
      <p class="auth-subtitle">Plataforma de Análise Eleitoral</p>

      <h2 class="auth-heading">Criar nova senha</h2>

      <!-- Erro de token inválido (mostrado antes do form) -->
      <div class="alert alert-error" id="tokenError" role="alert"></div>

      <!-- Formulário (oculto se token for inválido) -->
      <form id="resetForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="password">Nova senha</label>
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            placeholder="Mínimo 6 caracteres"
            autocomplete="new-password"
            required
            minlength="6"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm">Confirmar nova senha</label>
          <input
            class="form-input"
            type="password"
            id="confirm"
            name="confirm"
            placeholder="Repita a senha"
            autocomplete="new-password"
            required
          >
        </div>

        <div class="alert alert-error" id="errorMsg" role="alert"></div>
        <div class="alert alert-success" id="successMsg" role="status"></div>

        <button class="btn btn-primary" type="submit" id="submitBtn">
          <span class="btn-text">Salvar nova senha</span>
          <span class="btn-spinner"></span>
        </button>
      </form>

      <!-- Links auxiliares -->
      <div class="auth-footer">
        <a href="/login.html">&larr; Voltar ao login</a>
      </div>

    </div>
  </div>

  <script src="/js/reset-password.js"></script>
</body>
</html>
